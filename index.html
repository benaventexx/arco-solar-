<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#171C45">
<meta name="description" content="Índice UV em tempo real, rotina de bronzeamento guiada e histórico de exposição solar.">
<title>Arco Solar — Índice UV & Exposição</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand"><span class="dot"></span> <span id="appNameLabel">Arco Solar</span> <span style="opacity:.6; font-weight:400;">· <span id="betaLabel">beta</span></span></div>
    <div class="right">
      <select id="langSelect" class="langsel" aria-label="Idioma / Language">
        <option value="pt">PT</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
      </select>
      <button id="notifBtn" class="iconbtn" title="Ativar lembretes" aria-label="Ativar lembretes">🔔</button>
    </div>
  </header>

  <div class="locrow">
    <input id="cityInput" placeholder="Cidade" value="Nazaré" aria-label="Cidade">
    <button id="goBtn">Localizar</button>
    <button id="gpsBtn" title="Usar GPS" aria-label="Usar GPS">📍</button>
  </div>

  <div class="tabs" role="tablist">
    <div class="tab active" data-tab="today" role="tab">Hoje</div>
    <div class="tab" data-tab="skin" role="tab">Pele</div>
    <div class="tab" data-tab="history" role="tab">Histórico</div>
  </div>

  <div id="app">
    <div class="loading">A carregar dados solares…</div>
  </div>

  <div class="footerlinks">
    <a href="mailto:?subject=Feedback%20Arco%20Solar" id="feedbackLink">Beta — envia feedback</a>
    &nbsp;·&nbsp;
    <a href="legal/privacy.html" id="privacyLink">Privacidade</a>
    &nbsp;·&nbsp;
    <a href="legal/terms.html" id="termsLink">Termos</a>
  </div>

</div>

<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/solar-api.js"></script>
<script src="js/skin.js"></script>
<script src="js/skin-photo.js"></script>
<script src="js/timer.js"></script>
<script src="js/history.js"></script>
<script src="js/alerts.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
